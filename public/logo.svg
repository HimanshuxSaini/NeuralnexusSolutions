<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 180" width="100%" height="100%">
  <defs>
    <!-- Cyan to Teal gradient for the diagonal top face and Nexus text -->
    <linearGradient id="cyanTealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4D4" />
      <stop offset="35%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>

    <!-- Diagonal surface gradient matching the 3D lighting -->
    <linearGradient id="beamGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="30%" stop-color="#00B4D8" />
      <stop offset="70%" stop-color="#0FA3B1" />
      <stop offset="100%" stop-color="#007A87" />
    </linearGradient>

    <!-- Dark pillar gradients -->
    <linearGradient id="pillarDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2A3A" />
      <stop offset="100%" stop-color="#0B1520" />
    </linearGradient>

    <!-- Right pillar side extrusion (illuminated) -->
    <linearGradient id="rightExtrusion" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#008E9B" />
      <stop offset="60%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Node sphere 3D radial highlights -->
    <radialGradient id="sphereCyan" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#C5F9FF" />
      <stop offset="25%" stop-color="#00D2E0" />
      <stop offset="70%" stop-color="#0097A7" />
      <stop offset="100%" stop-color="#005B66" />
    </radialGradient>

    <radialGradient id="sphereDark" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#556575" />
      <stop offset="40%" stop-color="#1A2733" />
      <stop offset="100%" stop-color="#070D14" />
    </radialGradient>
  </defs>

  <!-- 3D ISOMETRIC "N" ICON -->
  <g transform="translate(15, 10)">
    <!-- Top-Right Dark Node Strut -->
    <line x1="130" y1="36" x2="105" y2="58" stroke="#1A2733" stroke-width="5.5" stroke-linecap="round" />
    <!-- Bottom-Left Cyan Node Strut -->
    <line x1="32" y1="130" x2="56" y2="110" stroke="#00A896" stroke-width="5.5" stroke-linecap="round" />

    <!-- Left Vertical Upright Pillar & Inner Bevel -->
    <path d="M 32 44 L 56 30 L 56 120 L 32 132 Z" fill="url(#pillarDark)" />
    <path d="M 32 44 L 32 132 L 25 125 L 25 50 Z" fill="#0A131C" />

    <!-- Main Diagonal Isometric Beam (Core of the N) -->
    <!-- Top illuminated surface with rich cyan/teal gradient -->
    <polygon points="56,46 126,104 106,126 36,68" fill="url(#beamGrad)" />
    <!-- Underside drop facet (dark shadow) -->
    <polygon points="36,68 106,126 106,138 36,80" fill="#07121C" />

    <!-- Right Vertical Upright Pillar -->
    <!-- Front dark face -->
    <polygon points="122,48 140,36 140,122 122,134" fill="#0E1924" />
    <!-- 3D Right Extrusion (Glowing Teal facet) -->
    <polygon points="140,36 150,44 150,116 140,122" fill="url(#rightExtrusion)" />
    <polygon points="122,48 130,42 130,128 122,134" fill="#1A2733" />

    <!-- 4 Spherical Neural Network Nodes -->
    <!-- Node 1: Top-Left (Cyan) -->
    <circle cx="32" cy="40" r="15" fill="url(#sphereCyan)" />
    <circle cx="28" cy="35" r="4.5" fill="white" opacity="0.65" />

    <!-- Node 2: Bottom-Left (Cyan) -->
    <circle cx="32" cy="130" r="15" fill="url(#sphereCyan)" />
    <circle cx="28" cy="125" r="4.5" fill="white" opacity="0.65" />

    <!-- Node 3: Top-Right (Dark Charcoal Node) -->
    <circle cx="132" cy="34" r="13" fill="url(#sphereDark)" />
    <circle cx="129" cy="30" r="3.5" fill="white" opacity="0.3" />

    <!-- Node 4: Bottom-Right (Deep Teal Node) -->
    <circle cx="140" cy="126" r="14.5" fill="url(#sphereCyan)" />
    <circle cx="136" cy="122" r="4.5" fill="white" opacity="0.6" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <!-- "Neural" in solid deep charcoal/navy -->
  <text x="195" y="98" font-family="'Sora', 'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Neural<tspan fill="url(#cyanTealGrad)" font-weight="900">Nexus</tspan></text>

  <!-- "S O L U T I O N S" in widely spaced uppercase text matching the image exactly -->
  <text x="200" y="142" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#1E293B" letter-spacing="12">SOLUTIONS</text>
</svg>
